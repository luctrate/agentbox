name: Tests and secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install catalog validation dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Check shell syntax
        run: bash -n bin/agentbox bin/agentbox-provider bin/agentbox-catalog images/base/entrypoint.sh
      - name: Check browser JavaScript syntax
        run: |
          node --check images/research-browser/research-browser.cjs
          node --check tests/research_browser_smoke.cjs
      - name: Validate both example catalogs
        run: |
          python3 deploy/catalog.py validate examples/catalog.yaml --platform examples/platform.json
          python3 deploy/catalog.py validate examples/research-catalog.yaml --platform examples/research-platform.json
      - name: Run fixture-based tests (no credentials or Docker daemon needed)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts='--all'
