name: Wrapper tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: bash -n bin/agentbox bin/agentbox-provider images/base/entrypoint.sh
      - name: Run fixture-based tests (no credentials or Docker daemon needed)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
